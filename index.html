<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Scaffolding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Bitcount+Single:wght@100..900&family=Commissioner:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display-output">
            <div class="display display-small results bitcount-single-calculator">500+150</div>
            <div class="display results bitcount-single-calculator">888888.88</div>
        </div>
        
        <!-- Row 1 -->
        <button class="btn top-row operator alt">AC</button>
        <button class="btn top-row operator alt">+/-</button>
        <button class="btn top-row operator alt">%</button>
        <button class="btn top-row operator">÷</button>
        <!-- Row 2 -->
        <button class="btn number">7</button>
        <button class="btn number">8</button>
        <button class="btn number">9</button>
        <button class="btn operator">×</button>
        <!-- Ro class="btn number"w 3 -->
        <button class="btn number">4</button>
        <button class="btn number">5</button>
        <button class="btn number">6</button>
        <button class="btn operator">-</button>
        <!-- Ro class="btn number"w 4 -->
        <button class="btn number">1</button>
        <button class="btn number">2</button>
        <button class="btn number">3</button>
        <button class="btn operator">+</button>
        <!-- Ro class="btn number"w 5 -->
        <button class="btn number btn-zero">0</button>
        <button class="btn">.</button>
        <button class="btn equals operator">=</button>
    </div>

</body>
</html>
