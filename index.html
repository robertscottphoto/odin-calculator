<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Scaffolding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Bitcount+Single:wght@100..900&family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="head">
        <p>Robert Valentine</p>
        <p>Odin Projects Foundations</p>
        <p><a href="https://github.com/robertscottphoto/odin-calculator">GitHub</a></p>
    </div>
    <div class="calculator">
        <div class="title" id="title">
            <h3 class="science-gothic-casio">OISAC</h3>
            <span class="pwr-container" id="power">
                <svg width="40px" height="40px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g id="SVGRepo_bgCarrier" stroke-width="0"/>
                    <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"/>
                    <g id="SVGRepo_iconCarrier"> <path d="M12 7V12M8 8.99951C7.37209 9.83526 7 10.8742 7 12C7 14.7614 9.23858 17 12 17C14.7614 17 17 14.7614 17 12C17 10.8742 16.6279 9.83526 16 8.99951M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="#ff0000" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" class="pwr-btn"/> </g>
                </svg>
            </span>
        </div>
        <div class="display-output display-output-off" id="display-background">
            <div class="display display-small results bitcount-single-calculator" id="temp-display" ></div>
            <div class="display results bitcount-single-calculator" id="main-display"></div>
        </div>
        <!--Grid Layout Applied-->
        <!-- Row 1 -->
        <button data-type="action" data-value="allClear" class="btn top-row operator alt">AC</button>
        <button data-type="action" data-value="plusMinus" class="btn top-row operator alt">+/-</button>
        <button data-type="operator" data-value="percentage" class="btn top-row operator alt">%</button>
        <button data-type="operator" data-value="divide" class="btn top-row operator">÷</button>
        <!-- Row 2 -->
        <button data-type="number" data-value="7" class="btn number">7</button>
        <button data-type="number" data-value="8" class="btn number">8</button>
        <button data-type="number" data-value="9" class="btn number">9</button>
        <button data-type="operator" data-value="multiply" class="btn operator">×</button>
        <!-- Row 3 -->
        <button data-type="number" data-value="4" class="btn number">4</button>
        <button data-type="number" data-value="5" class="btn number">5</button>
        <button data-type="number" data-value="6" class="btn number">6</button>
        <button data-type="operator" data-value="subtract" class="btn operator">-</button>
        <!-- Row 4 -->
        <button data-type="number" data-value="1" class="btn number">1</button>
        <button data-type="number" data-value="2" class="btn number">2</button>
        <button data-type="number" data-value="3" class="btn number">3</button>
        <button data-type="operator" data-value="add" class="btn operator">+</button>
        <!-- Row 5 -->
        <button data-type="number" data-value="0" class="btn number btn-zero">0</button>
        <button data-type="decimal" data-value="." class="btn">.</button>
        <button data-type="action" data-value="equals" class="btn equals operator">=</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
